name: Setup.exe olustur
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Uygulamayi derle
        run: >
          pyinstaller --noconfirm --windowed --name Kelebek --icon assets/kelebek.ico
          --collect-all pdfplumber --collect-all pdfminer --collect-all reportlab
          --collect-all python_calamine --add-data "fonts;fonts" --add-data "assets;assets" kelebek_baslat.py
      - name: Inno Setup kur ve kurulum sihirbazini olustur
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" kurulum\Kelebek.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Kelebek_Kurulum
          path: cikti/Kelebek_Kurulum.exe
